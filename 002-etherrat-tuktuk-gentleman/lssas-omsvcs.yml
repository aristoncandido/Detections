title: LSASS Memory Dump via comsvcs.dll MiniDump
id: 8f2d1a40-de02-0002
status: experimental
description: Detecta dump de credenciais do LSASS abusando rundll32 + comsvcs.dll
references:
    - https://thedfirreport.com/2026/05/11/flash-alert-etherrat-and-tuktuk-c2-end-in-the-gentleman-ransomware/
    - https://attack.mitre.org/techniques/T1003/001/
author: Ariston
date: 2026/06/15
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\rundll32.exe'
    selection_cmd:
        CommandLine|contains: 'comsvcs'
        CommandLine|contains:
            - 'MiniDump'
            - '#24'
            - '#+'
    condition: selection_img and selection_cmd
falsepositives:
    - Praticamente nenhum em ambiente de produção
level: critical
tags:
    - attack.t1003.001
    - attack.credential_access

