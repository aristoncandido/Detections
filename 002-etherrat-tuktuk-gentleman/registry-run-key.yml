title: Registry Run Key Persistence via Command Line
id: 8f2d1a40-de03-0003
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\reg.exe'
        CommandLine|contains|all:
            - 'add'
            - '\CurrentVersion\Run'
    condition: selection
level: high
tags:
    - attack.t1547.001
    - attack.persistence